name: CI

on:
  # Pushes to a branch with an open pull request are covered by `pull_request`;
  # limiting `push` to the default branch stops every commit running CI twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Game logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test

      - name: Stage the web bundle
        run: npm run build:www

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Sync web assets into the Android project
        run: npm run sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Confirm the app asks for no permissions it should not have
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          # Read the permissions out of the *merged* manifest in the built APK,
          # so a permission introduced by a dependency is caught too.
          "$AAPT" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u > perms.txt
          echo "Declared permissions:"; cat perms.txt
          # INTERNET is the only one this app may hold. It is not a runtime
          # permission and grants no access to anything on the device; Capacitor
          # needs it for its in-process localhost server.
          echo "android.permission.INTERNET" > allowed.txt
          if ! diff -q perms.txt allowed.txt > /dev/null; then
            echo "::error::Unexpected permissions. Only INTERNET is allowed."
            diff allowed.txt perms.txt || true
            exit 1
          fi

      - name: Confirm the game is packaged inside the APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          # A sync that silently did nothing would still produce a valid APK —
          # one that opens to a blank screen. Check the assets are really there.
          for entry in \
            assets/public/index.html \
            assets/public/src/js/main.js \
            assets/public/src/data/answers.js
          do
            unzip -l "$APK" | grep -q "$entry" \
              || { echo "::error::$entry is missing from the APK"; exit 1; }
          done
          echo "APK is $(du -h "$APK" | cut -f1) and contains the web bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: pentaword-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
