name: CI

on:
  # Pushes to a branch with an open pull request are covered by `pull_request`;
  # limiting `push` to the default branch stops every commit running CI twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Game logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test

      - name: Stage the web bundle
        run: npm run build:www

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: npm ci

      - name: Sync web assets into the Android project
        run: npm run sync:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Confirm the app asks for no permissions it should not have
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          # Read the permissions out of the *merged* manifest in the built APK,
          # so a permission introduced by a dependency is caught too.
          "$AAPT" dump permissions "$APK" \
            | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p" | sort -u > perms.txt
          echo "Declared permissions:"; cat perms.txt

          # Derive the package name from the APK rather than hardcoding it, so
          # this stays correct if the application ID ever changes.
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")

          # The permissions this app may hold. Anything else fails the build.
          #
          # Everything below is "normal" protection level: none is a runtime
          # permission, none is ever prompted for, and none grants access to
          # storage, location, camera, microphone, contacts or any other
          # personal data on the device.
          #
          #   INTERNET, ACCESS_NETWORK_STATE — Capacitor's in-process localhost
          #     server, and the Ads SDK fetching ads and checking whether there
          #     is a connection before it tries.
          #
          #   AD_ID — reads the resettable advertising ID. This is what the Play
          #     Console's Advertising ID declaration is checked against, so the
          #     two must agree. Users can reset or delete the ID in Android
          #     Settings.
          #
          #   ACCESS_ADSERVICES_AD_ID / _ATTRIBUTION / _TOPICS — Android Privacy
          #     Sandbox. These let the Ads SDK use the platform's own ad APIs
          #     rather than device identifiers where the platform supports it,
          #     which is the more private path, not a less private one. Declared
          #     by the SDK, not by this app.
          #
          #   FOREGROUND_SERVICE, WAKE_LOCK — declared by the Ads SDK so a video
          #     ad can finish playing without the device sleeping mid-view. The
          #     app itself starts no service and holds no wake lock.
          #
          #   <package>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION — generated by
          #     AndroidX Core for its own use of registerReceiver. Signature
          #     level and namespaced under this app's package, so only this app
          #     can ever hold it; it grants access to nothing.
          #
          # Listed one by one on purpose. A pattern match would let the next
          # dependency bring a permission in unnoticed, which is the whole thing
          # this check exists to prevent — and it has now caught two additions
          # that were not predicted, which is the argument for keeping it strict.
          printf '%s\n' \
            "android.permission.INTERNET" \
            "android.permission.ACCESS_NETWORK_STATE" \
            "android.permission.ACCESS_ADSERVICES_AD_ID" \
            "android.permission.ACCESS_ADSERVICES_ATTRIBUTION" \
            "android.permission.ACCESS_ADSERVICES_TOPICS" \
            "android.permission.FOREGROUND_SERVICE" \
            "android.permission.WAKE_LOCK" \
            "com.google.android.gms.permission.AD_ID" \
            "$PKG.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" | sort -u > allowed.txt

          if ! diff -q perms.txt allowed.txt > /dev/null; then
            echo "::error::Unexpected permissions. Review the addition before allowing it."
            diff allowed.txt perms.txt || true
            exit 1
          fi

      - name: Confirm the game is packaged inside the APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          # A sync that silently did nothing would still produce a valid APK —
          # one that opens to a blank screen. Check the assets are really there.
          for entry in \
            assets/public/index.html \
            assets/public/src/js/main.js \
            assets/public/src/data/answers.js
          do
            unzip -l "$APK" | grep -q "$entry" \
              || { echo "::error::$entry is missing from the APK"; exit 1; }
          done
          echo "APK is $(du -h "$APK" | cut -f1) and contains the web bundle"

      - uses: actions/upload-artifact@v4
        with:
          name: pentaword-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
