name: Release bundle

# Produces the signed Android App Bundle to upload to the Play Console.
#
# Trigger it by pushing a tag (`git tag v1.0.0 && git push origin v1.0.0`) or
# from the Actions tab, where you can set the version by hand.
#
# Required repository secrets — see docs/PUBLISHING.md for how to create them:
#   ANDROID_KEYSTORE_BASE64  the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name shown to players (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code — must increase with every Play upload'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  bundle:
    name: Signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Resolve version
        id: version
        # Inputs reach the script through the environment rather than being
        # interpolated into the shell, so a value containing shell syntax is
        # data, never code.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT_NAME: ${{ inputs.versionName }}
          INPUT_CODE: ${{ inputs.versionCode }}
        run: |
          if [ "$EVENT" = "push" ]; then
            read -r NAME CODE < <(tools/version-code.sh "$TAG")
          else
            NAME="$INPUT_NAME"
            CODE="$INPUT_CODE"
            if ! printf '%s' "$CODE" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::versionCode must be a positive whole number; got '$CODE'"
              exit 1
            fi
            if ! printf '%s' "$NAME" | grep -qE '^[0-9A-Za-z.+-]+$'; then
              echo "::error::versionName must be a plain version string; got '$NAME'"
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Pentaword $NAME (versionCode $CODE)"

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Sync web assets into the Android project
        run: npm run sync:android

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/PUBLISHING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        working-directory: android
        run: |
          ./gradlew --no-daemon bundleRelease \
            -Ppentaword.versionName='${{ steps.version.outputs.name }}' \
            -Ppentaword.versionCode='${{ steps.version.outputs.code }}' \
            -Ppentaword.keystore="$RUNNER_TEMP/upload.jks" \
            -Ppentaword.storePassword='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Ppentaword.keyAlias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Ppentaword.keyPassword='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Confirm the bundle is signed
        run: |
          BUNDLE=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "Built $BUNDLE"
          unzip -l "$BUNDLE" | grep -q 'META-INF/.*\.RSA\|META-INF/.*\.EC' \
            && echo "Signature block present" \
            || { echo "::error::The bundle is not signed."; exit 1; }

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: pentaword-${{ steps.version.outputs.name }}-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
